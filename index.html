<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17251e">
  <title>Attendance Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <style>
    :root{
      color-scheme:dark;
      --bg:#101713;--panel:#1a2720;--panel2:#223229;--border:#2b3b31;
      --muted:#a9b9ae;--text:#f4f7f4;--green:#75d69a;--red:#ff8585;--amber:#ffd166
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,sans-serif;padding:18px;max-width:580px;margin:auto}
    h1{font-size:24px;margin:6px 0 4px}
    h2{font-size:16px;margin:0 0 10px}
    .sub,.small,.empty,footer{color:var(--muted)}
    .sub{margin:0 0 16px;font-size:13px}
    .card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:16px;margin:14px 0}
    .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
    input{
      width:100%;background:var(--panel2);color:var(--text);border:1px solid #35493d;
      border-radius:12px;padding:10px 12px;font-size:14px;outline:none
    }
    input:focus{border-color:var(--green)}
    button{
      border:0;border-radius:12px;padding:11px 10px;font-size:13px;font-weight:700;
      cursor:pointer;color:#0b1710;background:var(--green);transition:opacity .15s
    }
    button:active{opacity:.8}
    button.absent{background:var(--red)}
    button.cancel{background:var(--amber)}
    button.sec{background:#2d3d34;color:var(--text)}
    button.danger{background:transparent;color:var(--red);border:1px solid #4a2c2c;padding:5px 9px;font-size:12px}
    .tabs{display:flex;gap:8px;margin:14px 0}
    .tab{flex:1;padding:10px;border-radius:12px;background:var(--panel);color:var(--muted);border:1px solid var(--border);font-weight:700}
    .tab.active{background:var(--green);color:#0b1710;border-color:var(--green)}
    .days{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
    .daybtn{
      flex:1;min-width:44px;padding:8px 4px;border-radius:10px;font-size:12px;font-weight:700;
      background:var(--panel2);color:var(--muted);border:1px solid #35493d;text-align:center
    }
    .daybtn.on{background:#26372c;color:var(--green);border-color:var(--green)}
    .badge{font-size:12px;padding:4px 9px;border-radius:99px;background:#26372c;color:var(--muted)}
    .timepill{font-size:12px;padding:3px 8px;border-radius:8px;background:#26372c;color:var(--amber);font-weight:600}
    .pct{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
    .ok{color:var(--green)}.warn{color:var(--red)}
    .meta{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}
    .hint{font-size:13px;margin-top:6px;font-weight:600}
    .logitem{padding:10px 0;border-bottom:1px solid #2b3b31;font-size:13px}
    .logitem:last-child{border-bottom:0}
    .tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:700;color:#0b1710}
    .tag.Present{background:var(--green)}.tag.Absent{background:var(--red)}.tag.Cancelled{background:var(--amber)}
    .small{font-size:12px;line-height:1.5}
    footer{text-align:center;font-size:12px;margin:20px 0}
  </style>
</head>
<body>
  <h1>Attendance Tracker</h1>
  <p class="sub">Enter your weekly timetable once &amp; log daily classes offline.</p>

  <!-- Add Subject & Timetable Slot -->
  <section class="card">
    <div class="row">
      <h2>Add to Timetable</h2>
      <div class="row" style="gap:6px">
        <span class="small">Target %</span>
        <input id="targetPct" type="number" min="1" max="100" value="75" style="width:64px;padding:6px 8px;text-align:center">
      </div>
    </div>

    <div class="grid2">
      <div>
        <label class="small" for="newSub">Subject name</label>
        <input id="newSub" type="text" placeholder="e.g., Quantum Mechanics">
      </div>
      <div>
        <label class="small" for="newTime">Class time</label>
        <input id="newTime" type="time" value="09:30">
      </div>
    </div>

    <div style="margin-top:8px">
      <span class="small">Select class days:</span>
      <div class="days" id="dayPicker">
        <button type="button" class="daybtn" data-d="1">Mon</button>
        <button type="button" class="daybtn" data-d="2">Tue</button>
        <button type="button" class="daybtn" data-d="3">Wed</button>
        <button type="button" class="daybtn" data-d="4">Thu</button>
        <button type="button" class="daybtn" data-d="5">Fri</button>
        <button type="button" class="daybtn" data-d="6">Sat</button>
      </div>
    </div>

    <button id="addSubBtn" style="width:100%;margin-top:12px">+ Save Subject to Timetable</button>
  </section>

  <!-- Date & Optional Cancellation Note -->
  <section class="card">
    <div class="grid2" style="margin-top:0">
      <div>
        <label class="small" for="logDate">Selected date (<span id="dayNameLabel">Today</span>)</label>
        <input id="logDate" type="date">
      </div>
      <div>
        <label class="small" for="logNote">Optional note (e.g., Prof missed)</label>
        <input id="logNote" type="text" placeholder="Prof on leave / reason">
      </div>
    </div>
  </section>

  <!-- Filter Tabs -->
  <div class="tabs">
    <button class="tab active" id="tabDay">Scheduled Classes</button>
    <button class="tab" id="tabAll">All Subjects</button>
  </div>

  <!-- Subject Cards -->
  <div id="subjectsList"></div>

  <!-- Recent Activity Log & Backups -->
  <section class="card">
    <div class="row">
      <h2>Recent Class Log</h2>
      <span class="badge" id="totalLogs">0 entries</span>
    </div>
    <div id="logsList" class="empty" style="margin-top:8px">No classes logged yet.</div>
    <div class="grid2" style="margin-top:14px">
      <button class="sec" id="exportBtn">Export CSV</button>
      <button class="sec" id="undoBtn">Undo Last Entry</button>
    </div>
    <div class="grid2" style="margin-top:8px">
      <button class="sec" id="backupBtn">Backup Data</button>
      <button class="sec" id="restoreBtn">Restore Data</button>
      <input type="file" id="restoreFile" accept=".json,application/json" style="display:none">
    </div>
  </section>

  <footer>Attendance Tracker · Offline PWA</footer>

  <script>
    const KEY = 'attendance-tracker-v2';
    const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const $ = id => document.getElementById(id);

    let viewMode = 'day';
    let selectedDays = new Set([1, 2, 3, 4, 5]);

    let state = {
      target: 75,
      subjects: [],
      logs: []
    };

    try {
      const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (saved && Array.isArray(saved.subjects) && Array.isArray(saved.logs)) {
        state = saved;
      }
    } catch (e) {}

    function save() {
      localStorage.setItem(KEY, JSON.stringify(state));
    }

    function todayISO() {
      const d = new Date();
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().slice(0, 10);
    }

    function getDayIndex(isoDate) {
      const [y, m, d] = isoDate.split('-').map(Number);
      return new Date(y, m - 1, d).getDay();
    }

    function format12h(t24) {
      if (!t24) return '';
      const [h, m] = t24.split(':').map(Number);
      const ampm = h >= 12 ? 'PM' : 'AM';
      const h12 = h % 12 || 12;
      return `${h12}:${String(m).padStart(2, '0')} ${ampm}`;
    }

    document.querySelectorAll('.daybtn').forEach(btn => {
      const d = Number(btn.dataset.d);
      if (selectedDays.has(d)) btn.classList.add('on');
      btn.onclick = () => {
        if (selectedDays.has(d)) {
          selectedDays.delete(d);
          btn.classList.remove('on');
        } else {
          selectedDays.add(d);
          btn.classList.add('on');
        }
      };
    });

    $('logDate').value = todayISO();
    $('targetPct').value = state.target || 75;
    $('logDate').onchange = () => render();

    $('targetPct').onchange = () => {
      const v = Math.min(100, Math.max(1, parseInt($('targetPct').value, 10) || 75));
      state.target = v;
      $('targetPct').value = v;
      save();
      render();
    };

    $('tabDay').onclick = () => {
      viewMode = 'day';
      $('tabDay').classList.add('active');
      $('tabAll').classList.remove('active');
      render();
    };

    $('tabAll').onclick = () => {
      viewMode = 'all';
      $('tabAll').classList.add('active');
      $('tabDay').classList.remove('active');
      render();
    };

    $('addSubBtn').onclick = () => {
      const name = $('newSub').value.trim();
      const time = $('newTime').value || '09:30';
      const days = [...selectedDays].sort();
      if (!name) return alert('Please type a subject name.');
      if (!days.length) return alert('Please select at least one day of the week.');

      state.subjects.push({
        id: 'sub_' + Date.now(),
        name,
        time,
        days
      });
      $('newSub').value = '';
      save();
      render();
    };

    function logClass(subjectId, status) {
      const sub = state.subjects.find(s => s.id === subjectId);
      if (!sub) return;
      const date = $('logDate').value || todayISO();
      const note = $('logNote').value.trim();
      state.logs.push({
        id: 'log_' + Date.now() + Math.random().toString(36).slice(2, 6),
        date,
        subjectId: sub.id,
        subjectName: sub.name,
        status,
        note
      });
      $('logNote').value = '';
      save();
      render();
    }

    function removeSubject(subjectId) {
      const sub = state.subjects.find(s => s.id === subjectId);
      if (!sub) return;
      if (confirm(`Remove "${sub.name}" from your timetable?`)) {
        state.subjects = state.subjects.filter(s => s.id !== subjectId);
        save();
        render();
      }
    }

    function deleteLog(logId) {
      state.logs = state.logs.filter(l => l.id !== logId);
      save();
      render();
    }

    $('undoBtn').onclick = () => {
      if (!state.logs.length) return;
      state.logs.pop();
      save();
      render();
    };

    $('exportBtn').onclick = () => {
      const rows = [
        ['Date', 'Subject', 'Status', 'Note'],
        ...state.logs.map(l => [l.date, l.subjectName, l.status, l.note || ''])
      ];
      const csv = rows.map(r => r.map(v => '"' + String(v).replaceAll('"', '""') + '"').join(',')).join('\n');
      downloadFile(csv, 'attendance-log.csv', 'text/csv');
    };

    $('backupBtn').onclick = () => {
      const json = JSON.stringify(state, null, 2);
      downloadFile(json, `attendance-backup-${todayISO()}.json`, 'application/json');
    };

    $('restoreBtn').onclick = () => $('restoreFile').click();

    $('restoreFile').onchange = e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (!parsed || !Array.isArray(parsed.subjects) || !Array.isArray(parsed.logs)) {
            return alert('Invalid backup file.');
          }
          if (confirm(`Restore ${parsed.subjects.length} subjects and ${parsed.logs.length} log entries? This will overwrite current app data.`)) {
            state = {
              target: parsed.target || 75,
              subjects: parsed.subjects,
              logs: parsed.logs
            };
            $('targetPct').value = state.target;
            save();
            render();
            alert('Backup restored successfully!');
          }
        } catch (err) {
          alert('Could not read backup file.');
        }
        $('restoreFile').value = '';
      };
      reader.readAsText(file);
    };

    function downloadFile(content, filename, mime) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([content], { type: mime }));
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function calcAdvice(attended, conducted, target) {
      if (conducted === 0) return 'No classes conducted yet.';
      const req = target / 100;
      const current = attended / conducted;
      if (current >= req) {
        const canMiss = Math.floor((attended / req) - conducted);
        return canMiss > 0
          ? `Safe: You can miss ${canMiss} more class${canMiss === 1 ? '' : 'es'}.`
          : 'On the border: Attend the next class to stay safe.';
      } else {
        const need = Math.ceil((req * conducted - attended) / (1 - req));
        return `Low: Attend next ${need} class${need === 1 ? '' : 'es'} in a row for ${target}%.`;
      }
    }

    function esc(str) {
      return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }

    function render() {
      const target = state.target || 75;
      const activeDate = $('logDate').value || todayISO();
      const dayIdx = getDayIndex(activeDate);
      $('dayNameLabel').textContent = DAYS[dayIdx];
      $('tabDay').textContent = `${DAYS[dayIdx]}'s Classes`;

      let visibleSubjects = [...state.subjects].sort((a, b) => (a.time || '').localeCompare(b.time || ''));
      if (viewMode === 'day') {
        visibleSubjects = visibleSubjects.filter(s => Array.isArray(s.days) && s.days.includes(dayIdx));
      }

      const container = $('subjectsList');
      if (!state.subjects.length) {
        container.innerHTML = `<section class="card"><div class="empty">Add your subjects, class times, and days above when you get your timetable.</div></section>`;
      } else if (!visibleSubjects.length) {
        container.innerHTML = `<section class="card"><div class="empty">No classes scheduled for ${DAYS[dayIdx]}. Switch to <strong>All Subjects</strong> to view your full timetable.</div></section>`;
      } else {
        container.innerHTML = visibleSubjects.map(sub => {
          const subLogs = state.logs.filter(l => l.subjectId === sub.id);
          const present = subLogs.filter(l => l.status === 'Present').length;
          const absent = subLogs.filter(l => l.status === 'Absent').length;
          const cancelled = subLogs.filter(l => l.status === 'Cancelled').length;
          const conducted = present + absent;
          const pct = conducted ? ((present / conducted) * 100).toFixed(1) : '0.0';
          const isOk = conducted === 0 || (present / conducted) * 100 >= target;
          const dayNames = (sub.days || []).map(d => DAYS[d]).join(', ');

          return `
            <section class="card">
              <div class="row">
                <div>
                  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                    <strong style="font-size:17px">${esc(sub.name)}</strong>
                    ${sub.time ? `<span class="timepill">${format12h(sub.time)}</span>` : ''}
                  </div>
                  <div class="meta">${esc(dayNames)} · Attended: <strong>${present}/${conducted}</strong> · Cancelled: <strong>${cancelled}</strong></div>
                </div>
                <div style="text-align:right">
                  <div class="pct ${isOk ? 'ok' : 'warn'}">${pct}%</div>
                  <button class="danger" onclick="removeSubject('${sub.id}')">Remove</button>
                </div>
              </div>
              <div class="hint ${isOk ? 'ok' : 'warn'}">${calcAdvice(present, conducted, target)}</div>
              <div class="grid3">
                <button onclick="logClass('${sub.id}','Present')">Present</button>
                <button class="absent" onclick="logClass('${sub.id}','Absent')">Absent</button>
                <button class="cancel" onclick="logClass('${sub.id}','Cancelled')">Cancelled</button>
              </div>
            </section>
          `;
        }).join('');
      }

      $('totalLogs').textContent = `${state.logs.length} entr${state.logs.length === 1 ? 'y' : 'ies'}`;
      const recent = [...state.logs].reverse().slice(0, 20);
      $('logsList').innerHTML = recent.length
        ? recent.map(l => `
            <div class="logitem row">
              <div>
                <span class="tag ${l.status}">${l.status}</span>
                <strong style="margin-left:6px">${esc(l.subjectName)}</strong>
                <div class="small" style="margin-top:3px">${esc(l.date)}${l.note ? ' · ' + esc(l.note) : ''}</div>
              </div>
              <button class="danger" onclick="deleteLog('${l.id}')">×</button>
            </div>
          `).join('')
        : '<div class="empty">No classes logged yet.</div>';
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    render();
  </script>
</body>
</html>
